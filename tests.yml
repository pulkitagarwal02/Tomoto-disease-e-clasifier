name: tests
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tensorflow-cpu numpy scikit-learn matplotlib seaborn Pillow pytest
      - run: pytest -q tests
